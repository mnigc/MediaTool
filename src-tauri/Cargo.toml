[package]
name = "medipress"
version = "0.1.0"
description = "Local media convert & compress"
authors = ["you"]
edition = "2021"

[lib]
name = "medipress_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
